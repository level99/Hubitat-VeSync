# pyvesync canonical request fixtures — Dual200S (Dual 200S Humidifier / LUH-D301S)
# Source: https://github.com/webdjoe/pyvesync
# Tag: 3.5.1 (commit 6ce2ae4 — 2026-11-08)
# Original path: src/tests/api/vesynchumidifier/Dual200S.yaml

set_auto_mode:
  json_object:
    payload:
      data:
        mode: auto
      method: setHumidityMode
      source: APP

set_humidity:
  json_object:
    payload:
      data:
        target_humidity: 50
      method: setTargetHumidity
      source: APP

set_manual_mode:
  json_object:
    payload:
      data:
        mode: manual
      method: setHumidityMode
      source: APP

set_mist_level:
  json_object:
    payload:
      data:
        id: 0
        level: 2
        type: mist
      method: setVirtualLevel
      source: APP

turn_off:
  json_object:
    payload:
      data:
        enabled: false
        id: 0
      method: setSwitch
      source: APP

turn_off_automatic_stop:
  json_object:
    payload:
      data:
        enabled: false
      method: setAutomaticStop
      source: APP

turn_off_display:
  json_object:
    payload:
      data:
        state: false
      method: setDisplay
      source: APP

turn_on:
  json_object:
    payload:
      data:
        enabled: true
        id: 0
      method: setSwitch
      source: APP

turn_on_automatic_stop:
  json_object:
    payload:
      data:
        enabled: true
      method: setAutomaticStop
      source: APP

turn_on_display:
  json_object:
    payload:
      data:
        state: true
      method: setDisplay
      source: APP

update:
  json_object:
    payload:
      data: {}
      method: getHumidifierStatus
      source: APP
